---
- name: Check whether psad is installed
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Status}
      - psad
  register: firewall_psad_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove psad and its orphaned dependencies
  ansible.builtin.apt:
    name: psad
    state: absent
    purge: true
    autoremove: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: "'install ok installed' in (firewall_psad_status.stdout | default(''))"

- name: Read the iptables alternatives state
  ansible.builtin.command:
    argv:
      - update-alternatives
      - --query
      - "{{ item }}"
  loop:
    - iptables
    - ip6tables
  register: firewall_alternatives
  changed_when: false
  failed_when: false
  check_mode: false

- name: Restore the default iptables backend
  ansible.builtin.command:
    argv:
      - update-alternatives
      - --auto
      - "{{ item.item }}"
  loop: "{{ firewall_alternatives.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  changed_when: true
  when:
    - item.rc is defined
    - item.rc == 0
    - "'manual' in (item.stdout | default(''))"
    - "'legacy' in (item.stdout | default(''))"

- name: Configure UFW default policies
  community.general.ufw:
    policy: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: "{{ firewall_default_incoming_policy }}" }
    - { direction: outgoing, policy: "{{ firewall_default_outgoing_policy }}" }
    - { direction: routed, policy: "{{ firewall_default_routed_policy }}" }
  notify: reload ufw

- name: Allow SSH with rate limiting
  community.general.ufw:
    rule: limit
    direction: in
    port: "{{ ssh_port_effective }}"
    proto: tcp
  notify: reload ufw

- name: Allow additional inbound TCP ports
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_in_tcp | unique }}"
  notify: reload ufw

- name: Allow outbound TCP ports
  community.general.ufw:
    rule: allow
    direction: out
    port: "{{ item }}"
    proto: tcp
  loop: "{{ (firewall_allowed_out_tcp + firewall_mail_ports) | unique }}"
  notify: reload ufw

- name: Allow outbound UDP ports
  community.general.ufw:
    rule: allow
    direction: out
    port: "{{ item }}"
    proto: udp
  loop: "{{ firewall_allowed_out_udp | unique }}"
  notify: reload ufw

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: "{{ firewall_ufw_logging }}"
  notify: reload ufw

- name: Remove the psad logging block from UFW rules
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - psad"
    state: absent
  loop:
    - /etc/ufw/before.rules
    - /etc/ufw/before6.rules
  notify: reload ufw

- name: Configure fail2ban defaults
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: restart fail2ban
  when: fail2ban_enabled | bool

- name: Configure the SSH fail2ban jail
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: restart fail2ban
  when: fail2ban_enabled | bool

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: fail2ban_enabled | bool
