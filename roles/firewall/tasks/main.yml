---
- name: Configure UFW default policies
  community.general.ufw:
    policy: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: "{{ firewall_default_incoming_policy }}" }
    - { direction: outgoing, policy: "{{ firewall_default_outgoing_policy }}" }
    - { direction: routed, policy: "{{ firewall_default_routed_policy }}" }
  notify: reload ufw

- name: Allow SSH with rate limiting
  community.general.ufw:
    rule: limit
    direction: in
    port: "{{ ssh_port_effective }}"
    proto: tcp
  notify: reload ufw

- name: Allow additional inbound TCP ports
  community.general.ufw:
    rule: allow
    direction: in
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_in_tcp | unique }}"
  notify: reload ufw

- name: Allow outbound TCP ports
  community.general.ufw:
    rule: allow
    direction: out
    port: "{{ item }}"
    proto: tcp
  loop: "{{ (firewall_allowed_out_tcp + firewall_mail_ports) | unique }}"
  notify: reload ufw

- name: Allow outbound UDP ports
  community.general.ufw:
    rule: allow
    direction: out
    port: "{{ item }}"
    proto: udp
  loop: "{{ firewall_allowed_out_udp | unique }}"
  notify: reload ufw

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: "{{ firewall_ufw_logging }}"
  notify: reload ufw

- name: Configure psad
  ansible.builtin.lineinfile:
    path: /etc/psad/psad.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: true
  loop:
    - regexp: '^EMAIL_ADDRESSES'
      line: 'EMAIL_ADDRESSES {{ mail_to if mail_enabled | bool else "root@localhost" }};'
    - regexp: '^EXPECT_TCP_OPTIONS'
      line: 'EXPECT_TCP_OPTIONS Y;'
    - regexp: '^ENABLE_PSADWATCHD'
      line: 'ENABLE_PSADWATCHD Y;'
    - regexp: '^ENABLE_AUTO_IDS '
      line: 'ENABLE_AUTO_IDS {{ "Y" if psad_enable_auto_ids | bool else "N" }};'
    - regexp: '^ENABLE_AUTO_IDS_EMAILS'
      line: 'ENABLE_AUTO_IDS_EMAILS {{ "Y" if (psad_auto_ids_emails | bool and mail_enabled | bool) else "N" }};'
    - regexp: '^AUTO_IDS_DANGER_LEVEL'
      line: 'AUTO_IDS_DANGER_LEVEL {{ psad_auto_ids_danger_level }};'
    - regexp: '^EMAIL_ALERT_DANGER_LEVEL'
      line: 'EMAIL_ALERT_DANGER_LEVEL {{ psad_email_alert_danger_level }};'
    - regexp: '^EMAIL_LIMIT'
      line: 'EMAIL_LIMIT {{ psad_email_limit }};'
    - regexp: '^HOSTNAME'
      line: 'HOSTNAME {{ ansible_hostname }};'
  notify: restart psad
  when: psad_enabled | bool

- name: Log blocked traffic for psad
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    insertbefore: "COMMIT"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - psad"
    block: |
      # log all traffic so psad can analyze
      -A INPUT -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
      -A FORWARD -j LOG --log-tcp-options --log-prefix "[IPTABLES] "
    backup: true
    create: true
  loop:
    - /etc/ufw/before.rules
    - /etc/ufw/before6.rules
  notify: reload ufw
  when: psad_enabled | bool

- name: Update psad signatures
  ansible.builtin.command: psad --sig-update
  changed_when: false
  failed_when: false
  retries: 2
  delay: 5
  when: psad_enabled | bool

- name: Enable and start psad
  ansible.builtin.systemd:
    name: psad
    enabled: true
    state: started
  when: psad_enabled | bool

- name: Configure fail2ban defaults
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: restart fail2ban
  when: fail2ban_enabled | bool

- name: Configure the SSH fail2ban jail
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: restart fail2ban
  when: fail2ban_enabled | bool

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: fail2ban_enabled | bool
