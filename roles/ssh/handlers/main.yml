---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart ssh service
  ansible.builtin.shell: |
    set -euo pipefail
    sshd -t
    if [ "{{ ssh_socket_active | default(false) | bool }}" = "True" ]; then
      systemctl restart {{ ssh_socket_name }}
    else
      systemctl restart {{ ssh_service_name }}
    fi
  args:
    executable: /bin/bash
