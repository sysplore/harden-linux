---
- name: Read the OpenSSH version
  ansible.builtin.command: ssh -V
  register: ssh_version
  changed_when: false
  check_mode: false

- name: Parse the OpenSSH version
  ansible.builtin.set_fact:
    ssh_version_text: "{{ ssh_version.stdout }}{{ ssh_version.stderr }}"

- name: Derive OpenSSH capability flags
  ansible.builtin.set_fact:
    ssh_version_major: "{{ ssh_version_text | regex_search('OpenSSH_([0-9]+)', '\\1') | first | int }}"
    ssh_version_minor: "{{ ssh_version_text | regex_search('OpenSSH_[0-9]+\\.([0-9]+)', '\\1') | first | int }}"

- name: Set OpenSSH feature flags
  ansible.builtin.set_fact:
    ssh_supports_pq_kex: "{{ (ssh_version_major | int > 9) or (ssh_version_major | int == 9) }}"
    ssh_supports_required_rsa_size: "{{ (ssh_version_major | int > 9) or (ssh_version_major | int == 9 and ssh_version_minor | int >= 1) }}"

- name: Build the effective KEX list
  ansible.builtin.set_fact:
    ssh_kex_algorithms_effective: >-
      {{ (['sntrup761x25519-sha512@openssh.com']
          if (ssh_enable_pq_kex | bool and ssh_supports_pq_kex | bool) else [])
         + ssh_kex_algorithms }}

- name: Detect whether ssh.socket is active
  ansible.builtin.command: systemctl is-active ssh.socket
  register: ssh_socket_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Record the ssh.socket state
  ansible.builtin.set_fact:
    ssh_socket_active: "{{ ssh_socket_status.stdout | trim == 'active' }}"

- name: Ensure sshd_config includes the drop-in directory
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    insertbefore: BOF
    firstmatch: true
    state: present
    backup: true
  notify: restart ssh service

- name: Remove the legacy managed block from sshd_config
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: '# {mark} ANSIBLE MANAGED BLOCK'
    state: absent
  notify: restart ssh service

- name: Deploy the SSH hardening drop-in
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: 'sshd -t -f %s'
  notify: restart ssh service

- name: Ensure the ssh.socket drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ssh_socket_active | bool

- name: Configure the ssh.socket port when socket activation is used
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.socket.d/10-ansible.conf
    content: |
      [Socket]
      ListenStream=
      ListenStream={{ ssh_port }}
    owner: root
    group: root
    mode: '0644'
  when: ssh_socket_active | bool
  notify:
    - reload systemd
    - restart ssh socket

- name: Validate the assembled sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false
  check_mode: false

- name: Remove short Diffie-Hellman moduli
  ansible.builtin.shell: |
    set -euo pipefail
    awk '$5 >= 3071' /etc/ssh/moduli > /etc/ssh/moduli.tmp
    if cmp -s /etc/ssh/moduli /etc/ssh/moduli.tmp; then
      rm -f /etc/ssh/moduli.tmp
      echo unchanged
    else
      mv /etc/ssh/moduli.tmp /etc/ssh/moduli
      echo changed
    fi
  args:
    executable: /bin/bash
  register: moduli_result
  changed_when: "'changed' in moduli_result.stdout"
  notify: restart ssh service
