---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install bootstrap packages
  ansible.builtin.apt:
    name:
      - sudo
      - python3
      - python3-apt
      - ca-certificates
      - openssh-server
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Require at least one credential for the hardening user
  ansible.builtin.assert:
    that:
      - (user_pw | length > 0) or (ssh_public_key | length > 0) or (sshpub_location | length > 0)
    fail_msg: "Set user_pw and/or ssh_public_key/sshpub_location for {{ hardening_user }}."

- name: Create service groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - sshusers
    - sudousers
    - suusers

- name: Create the hardening user
  ansible.builtin.user:
    name: "{{ hardening_user }}"
    password: >-
      {{ (user_pw | password_hash('yescrypt')) if (user_pw | length > 0 and pam_yescrypt | default(true) | bool)
         else ((user_pw | password_hash('sha512')) if user_pw | length > 0 else '*') }}
    update_password: "{{ 'always' if user_pw | default('', true) | length > 0 else 'on_create' }}"
    groups:
      - sshusers
      - sudousers
      - suusers
    append: true
    shell: /bin/bash
    create_home: true
    state: present
  no_log: true

- name: Ensure sudoers.d is included
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^@includedir /etc/sudoers.d'
    line: '@includedir /etc/sudoers.d'
    state: present
    validate: 'visudo -cf %s'
    backup: true

- name: Locate the active sudo binary
  ansible.builtin.command:
    argv:
      - readlink
      - -f
      - /usr/bin/sudo
  register: sudo_binary_path
  changed_when: false
  failed_when: false

- name: Read the active sudo version
  ansible.builtin.command:
    argv:
      - sudo
      - -V
  register: sudo_version_output
  changed_when: false
  failed_when: false

- name: Detect sudo-rs
  ansible.builtin.set_fact:
    sudo_is_sudo_rs: >-
      {{ ('sudo-rs' in ((sudo_version_output.stdout | default('')) ~ (sudo_version_output.stderr | default(''))))
         or ('cargo/bin/sudo' in (sudo_binary_path.stdout | default(''))) }}

- name: Harden sudo defaults
  ansible.builtin.template:
    src: 00-hardening.j2
    dest: /etc/sudoers.d/00-hardening
    owner: root
    group: root
    mode: '0440'
    backup: true
    validate: 'visudo -cf %s'

- name: Limit sudo to the sudousers group
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-sudousers
    content: |
      %sudousers ALL=(ALL:ALL) ALL
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Grant the hardening user sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/20-{{ hardening_user }}"
    content: |
      {% if sudo_nopasswd | bool %}
      {{ hardening_user }} ALL=(ALL:ALL) NOPASSWD: ALL
      {% else %}
      {{ hardening_user }} ALL=(ALL:ALL) ALL
      {% endif %}
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'

- name: Locate the su binary
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/su
    - /bin/su
  register: su_binary

- name: Resolve the su binary path
  ansible.builtin.set_fact:
    su_path: "{{ (su_binary.results | selectattr('stat.exists') | first).item }}"

- name: Read the current su statoverride
  ansible.builtin.command:
    argv:
      - dpkg-statoverride
      - --list
      - "{{ su_path }}"
  register: su_override
  changed_when: false
  failed_when: false

- name: Restrict su to the suusers group
  ansible.builtin.command:
    argv:
      - dpkg-statoverride
      - --update
      - --add
      - root
      - suusers
      - "4750"
      - "{{ su_path }}"
  when: su_override.stdout | trim != 'root suusers 4750 ' ~ su_path
  changed_when: true

- name: Check whether the hardening user exists
  ansible.builtin.command:
    argv:
      - getent
      - passwd
      - "{{ hardening_user }}"
  register: hardening_user_lookup
  changed_when: false
  failed_when: false
  check_mode: false

- name: Explain the skipped key install in check mode
  ansible.builtin.debug:
    msg: >-
      Check mode: {{ hardening_user }} does not exist yet, so the authorized
      key was not installed. Uncheck Dry run and rerun to create the user.
  when:
    - ansible_check_mode
    - hardening_user_lookup.stdout | default('') | length == 0

- name: Install the authorized SSH key
  ansible.posix.authorized_key:
    user: "{{ hardening_user }}"
    key: "{{ ssh_public_key if ssh_public_key | length > 0 else lookup('file', sshpub_location) }}"
    exclusive: "{{ ssh_authorized_keys_exclusive | bool }}"
    state: present
  when:
    - (ssh_public_key | length > 0) or (sshpub_location | length > 0)
    - (not ansible_check_mode) or (hardening_user_lookup.stdout | length > 0)
