---
mail_to: ""
mail_from: "root@{{ ansible_fqdn }}"
mail_smtp_server: ""
mail_port: 587
mail_tls: true
mail_tls_starttls: true
mail_auth: true
mail_user: "{{ mail_from }}"
mail_pw: ""
mail_verify: false
mail_enabled: >-
  {{ (harden_features.mail | default(true) | bool)
     and (mail_to | default('', true) | length > 0)
     and (mail_smtp_server | default('', true) | length > 0)
     and (mail_pw | default('', true) | length > 0) }}
mail_from_effective: "{{ mail_from | default('', true) | default('root@' ~ ansible_fqdn, true) }}"
mail_user_effective: "{{ mail_user | default('', true) | default(mail_from_effective, true) }}"
mail_port_effective: "{{ mail_port | default('', true) | default(587, true) | int }}"
mail_tls_starttls_effective: "{{ mail_tls_starttls | default('', true) | default(true, true) | bool }}"
mail_verify_effective: "{{ mail_verify | default('', true) | default(false, true) | bool }}"
