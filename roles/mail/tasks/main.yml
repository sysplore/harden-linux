---
- name: Require SMTP settings
  ansible.builtin.assert:
    that:
      - mail_smtp_server | length > 0
      - mail_pw | length > 0
    fail_msg: "mail_smtp_server and mail_pw are required when mail is enabled."

- name: Configure msmtp
  ansible.builtin.template:
    src: msmtprc.j2
    dest: /etc/msmtprc
    owner: root
    group: msmtp
    mode: '0640'
    backup: true
  no_log: true

- name: Configure mail aliases
  ansible.builtin.lineinfile:
    path: /etc/aliases
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    create: true
    backup: true
  loop:
    - { regexp: '^root:', line: 'root: {{ mail_to }}' }
    - { regexp: '^default:', line: 'default: {{ mail_to }}' }

- name: Point mail(1) at msmtp
  ansible.builtin.lineinfile:
    path: /etc/mail.rc
    regexp: '^set sendmail'
    line: 'set sendmail="/usr/bin/msmtp -t"'
    state: present
    create: true
    backup: true

- name: Send a test message
  ansible.builtin.command:
    argv:
      - /usr/bin/mail
      - -s
      - Hardening test message
      - "{{ mail_to }}"
    stdin: "Test message from the hardening playbook.\n"
  register: mail_test
  changed_when: false
  failed_when: false
  when: mail_verify | bool

- name: Report a failed test message
  ansible.builtin.debug:
    msg: "WARNING: test mail failed: {{ mail_test.stderr | default('') | trim }}"
  when:
    - mail_verify | bool
    - mail_test is defined
    - mail_test.rc | default(0) != 0
