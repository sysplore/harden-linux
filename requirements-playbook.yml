---
- name: Bootstrap a Debian or Ubuntu server
  hosts: "{{ fleet_hosts | default('', true) | default(fleet_host | default('linux', true), true) }}"
  gather_facts: false
  vars:
    user_pw_effective: >-
      {{ harden_user_password | default('', true)
         | default(user_pw | default('', true), true) }}
    ansible_become_password: >-
      {{ target_become_password | default('', true)
         | default(harden_user_password | default('', true), true)
         | default(user_pw | default('', true), true) }}
  remote_user: "{{ ansible_user | default(bootstrap_user | default('', true), true) | default(omit, true) }}"
  become: "{{ (ansible_user | default(bootstrap_user | default('', true), true) | default('', true)) != 'root' }}"
  any_errors_fatal: true
  pre_tasks:
    - name: Select the sudo binary for privilege escalation
      ansible.builtin.stat:
        path: /usr/bin/sudo.ws
      become: false
      register: sudo_ws_binary

    - name: Use the classic sudo binary on sudo-rs systems
      ansible.builtin.set_fact:
        ansible_become_exe: /usr/bin/sudo.ws
      become: false
      when: sudo_ws_binary.stat.exists | bool

    - name: Gather facts with the resolved sudo binary
      ansible.builtin.setup:
      become: true

    - name: Assert supported platform
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
          - (ansible_distribution != 'Debian') or (ansible_distribution_major_version | int >= 12)
          - (ansible_distribution != 'Ubuntu') or (ansible_distribution_major_version | int >= 22)
        fail_msg: "Supported platforms: Debian 12+ and Ubuntu 22.04+."
  roles:
    - role: requirements
      tags: [requirements, bootstrap]
