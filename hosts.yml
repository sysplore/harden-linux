---
# Inventory. Add real hosts under the debian/ubuntu groups.
# Group vars live in group_vars/<group>.yml.
# Per-host connection details and secrets live in host_vars/<host>.yml.
#
# Example:
#   debian:
#     hosts:
#       web01:
#         ansible_host: 203.0.113.10
#   ubuntu:
#     hosts:
#       app01:
#         ansible_host: 203.0.113.11
all:
  children:
    linux:
      children:
        debian:
          hosts: {}
        ubuntu:
          hosts: {}
