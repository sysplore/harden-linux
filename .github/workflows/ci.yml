---
name: ci

"on":
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint passlib
          ansible-galaxy collection install -r requirements.yml
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint
      - name: Syntax check main playbook
        run: ansible-playbook --syntax-check -i hosts.yml main-playbook.yml
      - name: Syntax check bootstrap playbook
        run: ansible-playbook --syntax-check -i hosts.yml requirements-playbook.yml
