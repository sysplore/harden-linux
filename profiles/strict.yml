---
# Strict profile for high-value hosts. Review before applying:
# - MFA requires per-user enrollment (nullok is used during rollout).
# - proc_hidepid can break monitoring agents; test it first.
# - Automatic reboots are enabled at 03:30.
harden_features:
  packages: true
  system: true
  ntp: true
  logging: true
  mail: true
  notify: true
  ssh: true
  password_policy: true
  unattended_upgrades: true
  firewall: true
  clamav: true
  rkhunter: true
  integrity: true
  auditd: true
  lynis: true
  mfa: true

password_minlen: 16
password_difok: 4
password_retry: 3
password_dictcheck: true
password_usercheck: true
password_gecoscheck: true
password_enforcing: true
faillock_enabled: true
faillock_deny: 3
faillock_unlock_time: 1800
faillock_fail_interval: 900

login_defs_pass_max_days: 90
login_defs_pass_min_days: 1
login_defs_pass_warn_age: 14

ssh_password_authentication: false
ssh_max_auth_tries: 2
ssh_max_sessions: 2
ssh_login_grace_time: 20
ssh_required_rsa_size: 3072
ssh_enable_pq_kex: true

proc_hidepid: 2
mount_tmp_hardening: true
mount_var_tmp_hardening: true
mount_dev_shm_hardening: true
mount_home_hardening: true

unattended_upgrades_automatic_reboot: true
unattended_upgrades_reboot_time: "03:30"
unattended_upgrades_remove_unused: true
