---
- name: Harden Debian and Ubuntu servers
  hosts: "{{ fleet_hosts | default('', true) | default(fleet_host | default('linux', true), true) }}"
  remote_user: "{{ ansible_user | default('', true) | default(omit, true) }}"
  become: true
  become_method: ansible.builtin.sudo
  force_handlers: false
  any_errors_fatal: false
  gather_facts: true
  serial: "{{ harden_serial | default('100%') }}"
  vars:
    user_pw_effective: >-
      {{ harden_user_password | default('', true)
         | default(user_pw | default('', true), true) }}
    ansible_become_password: >-
      {{ '' if sudo_nopasswd | bool else (
         target_become_password | default('', true)
         | default(harden_user_password | default('', true), true)
         | default(user_pw | default('', true), true)) }}
  vars_files:
    - "profiles/{{ harden_profile | default('baseline', true) }}.yml"
  pre_tasks:
    - name: Assert supported platform
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
          - (ansible_distribution != 'Debian') or (ansible_distribution_major_version | int >= 12)
          - (ansible_distribution != 'Ubuntu') or (ansible_distribution_major_version | int >= 22)
        fail_msg: "Supported platforms: Debian 12+ and Ubuntu 22.04+."
      tags: [always]

    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      environment:
        DEBIAN_FRONTEND: noninteractive
      tags: [always]

    - name: Warn when connecting as root
      ansible.builtin.debug:
        msg: "WARNING: ansible_user is root. Use a dedicated sudo user for day-to-day hardening."
      when: ansible_user | default('') == 'root'
      tags: [always]

    - name: Warn when notification email is set without SMTP
      ansible.builtin.debug:
        msg: >-
          mail_to is set but mail_smtp_server or mail_pw is empty; email
          notifications are disabled.
      when:
        - harden_features.mail | default(true) | bool
        - mail_to | default('', true) | length > 0
        - not (mail_enabled | bool)
      tags: [always]

  roles:
    - role: packages
      when: harden_features.packages | default(true) | bool
      tags: [packages, base]

    - role: system_hardening
      when: harden_features.system | default(true) | bool
      tags: [system, hardening]

    - role: ntp
      when: harden_features.ntp | default(true) | bool
      tags: [ntp]

    - role: mail
      when:
        - harden_features.mail | default(true) | bool
        - mail_enabled | bool
      tags: [mail]
      ignore_errors: "{{ harden_continue_on_error | bool }}"

    - role: notify
      when: harden_features.notify | default(true) | bool
      tags: [notify, notifications]

    - role: logging
      when: harden_features.logging | default(true) | bool
      tags: [logging]

    - role: ssh
      when: harden_features.ssh | default(true) | bool
      tags: [ssh]

    - role: mfa
      when:
        - harden_features.mfa | default(false) | bool
        - ssh_mfa_enabled | bool
      tags: [mfa]
      ignore_errors: "{{ harden_continue_on_error | bool }}"

    - role: password_quality
      when: harden_features.password_policy | default(true) | bool
      tags: [password, auth]

    - role: unattended_upgrades
      when: harden_features.unattended_upgrades | default(true) | bool
      tags: [updates, patching]

    - role: firewall
      when: harden_features.firewall | default(true) | bool
      tags: [firewall, network]

    - role: clamav
      when: harden_features.clamav | default(true) | bool
      tags: [clamav, malware]
      ignore_errors: "{{ harden_continue_on_error | bool }}"

    - role: rkhunter
      when: harden_features.rkhunter | default(true) | bool
      tags: [rkhunter, malware]
      ignore_errors: "{{ harden_continue_on_error | bool }}"

    - role: integrity
      when: harden_features.integrity | default(true) | bool
      tags: [integrity, aide]
      ignore_errors: "{{ harden_continue_on_error | bool }}"

    - role: auditd
      when:
        - harden_features.auditd | default(true) | bool
        - ansible_virtualization_type | default('') not in ['docker', 'lxc', 'containerd']
      tags: [auditd, audit]

    - role: lynis
      when: harden_features.lynis | default(true) | bool
      tags: [lynis, audit]
      ignore_errors: "{{ harden_continue_on_error | bool }}"

  post_tasks:
    - name: Verify sshd configuration
      ansible.builtin.command: sshd -t
      changed_when: false
      when: harden_features.ssh | default(true) | bool
      tags: [verify]

    - name: Verify UFW status
      ansible.builtin.command: ufw status verbose
      changed_when: false
      failed_when: false
      when:
        - harden_features.firewall | default(true) | bool
        - firewall_enabled | bool
      tags: [verify]

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      tags: [verify]

    - name: Report reboot-required state
      ansible.builtin.debug:
        msg: "Reboot required to finish updates."
      when: reboot_required_file.stat.exists
      tags: [verify]

    - name: Apply pending handlers before registration
      ansible.builtin.meta: flush_handlers
      tags: [always]

    - name: Register the host in the Semaphore inventory
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/scripts/semaphore_inventory.py"
          - add-host
          - "--host"
          - "{{ inventory_hostname }}"
          - "--address"
          - "{{ ansible_host | default(inventory_hostname, true) }}"
          - "--group"
          - "{{ target_group if (target_group is defined and target_group | length > 0)
               else ('debian' if 'debian' in (hostvars[inventory_hostname].group_names | default([]))
                     else 'ubuntu') }}"
          - "--user"
          - "{{ harden_user | default('', true)
               | default(user_name | default('', true), true)
               | default(semaphore_ssh_login | default('', true), true)
               | default('ansible', true) }}"
          - "--port"
          - "{{ ssh_port_effective }}"
      environment:
        SEMAPHORE_URL: "{{ semaphore_url | default('') }}"
        SEMAPHORE_PROJECT_ID: "{{ semaphore_project_id | default('') }}"
        SEMAPHORE_INVENTORY_ID: "{{ semaphore_inventory_id | default('') }}"
        SEMAPHORE_INVENTORY_CHECK: "false"
      delegate_to: localhost
      register: inventory_registration
      changed_when: >-
        inventory_registration.stdout_lines | default([]) | first | default('') == 'changed'
      when:
        - inventory_registration_enabled | default(false) | bool
        - not ansible_check_mode
        - semaphore_url | default('', true) | length > 0
        - semaphore_project_id | default('', true) | length > 0
        - semaphore_inventory_id | default('', true) | length > 0
        - (lookup('env', 'semaphore_api_token') | default('', true) | length > 0)
          or (lookup('env', 'SEMAPHORE_API_TOKEN') | default('', true) | length > 0)
      become: false
      tags: [register]

    - name: Store the hardening user password for future runs
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/scripts/semaphore_inventory.py"
          - store-password
      environment:
        SEMAPHORE_URL: "{{ semaphore_url | default('') }}"
        SEMAPHORE_PROJECT_ID: "{{ semaphore_project_id | default('') }}"
        SEMAPHORE_INVENTORY_ID: "{{ semaphore_inventory_id | default('') }}"
        SEMAPHORE_USER_PW: "{{ user_pw_effective }}"
      delegate_to: localhost
      register: password_storage
      changed_when: >-
        password_storage.stdout_lines | default([]) | first | default('') == 'changed'
      when:
        - inventory_registration_enabled | default(false) | bool
        - not ansible_check_mode
        - semaphore_url | default('', true) | length > 0
        - semaphore_project_id | default('', true) | length > 0
        - user_pw_effective | default('', true) | length > 0
        - (lookup('env', 'semaphore_api_token') | default('', true) | length > 0)
          or (lookup('env', 'SEMAPHORE_API_TOKEN') | default('', true) | length > 0)
      become: false
      tags: [register]

    - name: Show the inventory registration result
      ansible.builtin.debug:
        msg: "{{ inventory_registration.stdout_lines | default([]) }}"
      when:
        - inventory_registration is defined
        - inventory_registration.stdout_lines | default([]) | length > 0
      tags: [register]
