---
# Register a hardened host in the Semaphore inventory. harden-one and
# fleet-playbook both import this after the hardening plays. It only runs when
# exactly one host was selected; a multi-host or "All linux hosts" run skips it.

- name: Register the hardened host in the Semaphore inventory
  hosts: localhost
  gather_facts: false
  vars:
    registration_host: >-
      {{ target_host | default(
           (fleet_host | default('', true) if (fleet_hosts | default('', true) | length == 0) else ''), true) }}
    registration_port: >-
      {{ ssh_port | default('', true) | default(22, true) | int }}
    registration_user: >-
      {{ harden_user | default('', true)
         | default(user_name | default('', true), true)
         | default(semaphore_ssh_login | default('', true), true)
         | default('ansible', true) }}
    registration_group_effective: >-
      {{ target_group if (target_group is defined and target_group | length > 0)
         else ('debian' if (registration_host | length > 0)
                         and ('debian' in (hostvars[registration_host].group_names | default([])))
              else 'ubuntu') }}
    registration_target_supported: "{{ ':' not in registration_host }}"
    inventory_settings_present: >-
      {{
        (semaphore_url | default('', true) | length > 0)
        or (semaphore_project_id | default('', true) | length > 0)
        or (semaphore_inventory_id | default('', true) | length > 0)
        or (lookup('env', 'semaphore_api_token') | default('', true) | length > 0)
        or (lookup('env', 'SEMAPHORE_API_TOKEN') | default('', true) | length > 0)
      }}
    inventory_settings_complete: >-
      {{
        (semaphore_url | default('', true) | length > 0)
        and (semaphore_project_id | default('', true) | length > 0)
        and (semaphore_inventory_id | default('', true) | length > 0)
        and (
          (lookup('env', 'semaphore_api_token') | default('', true) | length > 0)
          or (lookup('env', 'SEMAPHORE_API_TOKEN') | default('', true) | length > 0)
        )
      }}
  tasks:
    - name: Validate the target
      ansible.builtin.assert:
        that:
          - registration_host | length > 0
          - registration_group_effective in ['debian', 'ubuntu']
        fail_msg: "A single inventory host and a debian or ubuntu group are required."
        quiet: true
      when: registration_host | length > 0

    - name: Skip inventory registration when no single host is selected
      ansible.builtin.debug:
        msg: >-
          No single host was selected (All linux hosts or multiple hosts);
          skipping inventory registration. Use sync-hosts after manual changes.
      when: registration_host | length == 0

    - name: Validate the inventory registration settings
      ansible.builtin.assert:
        that:
          - inventory_settings_complete
        fail_msg: >-
          semaphore_url, semaphore_project_id, semaphore_inventory_id and the
          semaphore_api_token environment secret must all be set to register
          the host. Rerun scripts/semaphore_bootstrap.py.
        quiet: true
      when:
        - registration_host | length > 0
        - inventory_settings_present

    - name: Skip inventory registration when it is not configured
      ansible.builtin.debug:
        msg: >-
          Semaphore inventory registration is not configured; the host was
          hardened but not added to the inventory.
      when:
        - registration_host | length > 0
        - not inventory_settings_present

    - name: Explain the skipped registration for an IPv6 target
      ansible.builtin.debug:
        msg: >-
          registration_host is an IPv6 address. Add it with the add-host
          template using a DNS name and the IPv6 address so the fleet host
          dropdown can target it.
      when:
        - registration_host | length > 0
        - inventory_settings_present
        - not registration_target_supported

    - name: Register the host in the Semaphore inventory
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/scripts/semaphore_inventory.py"
          - add-host
          - "--host"
          - "{{ registration_host }}"
          - "--address"
          - "{{ registration_host }}"
          - "--group"
          - "{{ registration_group_effective }}"
          - "--user"
          - "{{ registration_user }}"
          - "--port"
          - "{{ registration_port }}"
      environment:
        SEMAPHORE_URL: "{{ semaphore_url }}"
        SEMAPHORE_PROJECT_ID: "{{ semaphore_project_id }}"
        SEMAPHORE_INVENTORY_ID: "{{ semaphore_inventory_id }}"
        SEMAPHORE_INVENTORY_CHECK: "false"
      register: registration
      changed_when: >-
        registration.stdout_lines | default([]) | first | default('') == 'changed'
      check_mode: false
      when:
        - registration_host | length > 0
        - inventory_settings_complete
        - registration_target_supported
        - not ansible_check_mode

    - name: Explain the skipped registration in check mode
      ansible.builtin.debug:
        msg: "Check mode: the host was not added to the Semaphore inventory."
      when:
        - registration_host | length > 0
        - inventory_settings_complete
        - registration_target_supported
        - ansible_check_mode

    - name: Show the registration result
      ansible.builtin.debug:
        msg: "{{ registration.stdout_lines | default([]) }}"
      when:
        - registration_host | length > 0
        - inventory_settings_complete
        - registration_target_supported
        - not ansible_check_mode
